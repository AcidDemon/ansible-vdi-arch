---
- name: Restart nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted   # Arch's unit has no ExecReload
  when: not sysroot

- name: Reload networkd
  ansible.builtin.command: networkctl reload
  changed_when: true
  when: not sysroot

- name: Restart resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: not sysroot

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: reloaded
  when: not sysroot

- name: Rebuild initramfs
  ansible.builtin.command: "{{ in_chroot }} mkinitcpio -P"
  changed_when: true

- name: Update grub
  ansible.builtin.command: "{{ in_chroot }} grub-mkconfig -o /boot/grub/grub.cfg"
  changed_when: true
