# picom 13 -- Catppuccin Mocha, modelled on Cozytile.
# No GPU on this VM (llvmpipe), so xrender only. Dropped from Cozytile:
#   backend "glx", dual_kawase blur (glx-only), most per-app opacity rules,
#   open/close/geometry animations (extra frames over NoMachine/xrdp).

backend = "xrender";
# Virtual X display (xorgxrdp / NoMachine), there is no real vblank to sync to.
vsync = false;
detect-rounded-corners = true;
detect-client-opacity = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.35;
shadow-color = "#11111b";   # Mocha crust

# Fading (~12 steps, short and cheap)
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 10;

# Rounded corners
corner-radius = 14;

# Later rules win when they set the same option.
rules: (
  {
    # GTK menus/tooltips are rectangular; CSD dialogs draw their own shadow and corners.
    match = "window_type = 'tooltip' || window_type = 'menu' || "
            "window_type = 'dropdown_menu' || window_type = 'popup_menu' || "
            "_GTK_FRAME_EXTENTS@";
    shadow = false;
    corner-radius = 0;
  },
  {
    # rofi 2.0 paints its rounded corners opaque black on X11, so picom cuts them.
    # 12 = border-radius of the launcher (rofi) and corner_radius (dunstrc); the
    # 10px/8px rofi menus lose a sliver of border at the corners.
    match = "class_g = 'Rofi' || class_g = 'Dunst'";
    shadow = false;
    corner-radius = 12;
  },
  {
    # kitty asks for an sRGB framebuffer, and llvmpipe's GLX has no sRGB visual with
    # alpha, so background_opacity never applies ("Failed to enable transparency").
    # Cozytile's way instead: the whole window at 90%, text included.
    match = "class_g = 'kitty'";
    opacity = 0.9;
  },
  {
    # qtile bar and its popups (no WM_CLASS; qtile tags them QTILE_INTERNAL=1).
    # Keep rounding (floating bar with margins looks right rounded), drop the shadow.
    match = "QTILE_INTERNAL = 1 || window_type = 'dock'";
    shadow = false;
  },
  {
    # flameshot capture overlay must be painted untouched.
    match = "class_g = 'flameshot'";
    shadow = false;
    fade = false;
    corner-radius = 0;
  },
  {
    # picom 13 no longer un-rounds fullscreen windows by itself.
    match = "fullscreen";
    shadow = false;
    corner-radius = 0;
  }
);
