---
# Day-2 runs, over WireGuard:  ansible-playbook site.yml --ask-vault-pass
- name: Configure the desktop VPS
  hosts: vdi
  become: true
  gather_facts: false
  vars_files:
    - vars/desktops.yml
  pre_tasks:
    - name: Wait for the system
      ansible.builtin.wait_for_connection:
        timeout: 300
  roles:
    - system
    - desktop
    - apps   # software, services, "(via Tor)" menu entries
    - shell  # zsh + powerlevel10k, fzf-tab, eza/bat, tmux, yazi (as on Ted)
    - role: xrdp
      when: xrdp | default(false)
    - role: rice   # qtile look: Catppuccin Mocha, Ted's rofi, dotfiles
      when: rice | default(false) and 'qtile' in [desktop, xrdp_desktop]
