[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
callback_result_format = yaml
nocows = True
interpreter_python = auto_silent

[privilege_escalation]
become = False

[ssh_connection]
# also lets become_user switch to the unprivileged aurbuild user without temp-file ACLs
pipelining = True
